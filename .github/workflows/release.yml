name: Build and publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            configure: -A x64
            binary: build/Release/reaper_roto.dll
          - platform: macos-intel
            runner: macos-15-intel
            configure: -DCMAKE_OSX_ARCHITECTURES=x86_64
            binary: build/reaper_roto.dylib
          - platform: macos-arm64
            runner: macos-15
            configure: -DCMAKE_OSX_ARCHITECTURES=arm64
            binary: build/reaper_roto.dylib
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Run automated tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package beta
        run: python scripts/package-beta.py --platform ${{ matrix.platform }} --binary ${{ matrix.binary }}
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: roto-reaper-v0.4.0-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
            --verify-tag \
            --title "$GITHUB_REF_NAME — Ableton VST3 mapping compatibility" \
            --notes-file "RELEASE-NOTES-$GITHUB_REF_NAME.md"
